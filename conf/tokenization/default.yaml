vocab_size: 10000
save_path: tokenizer.pkl
tokenizer:
  _target_: minigpt.tokenization.BPETokenizer
  vocab_size: ${tokenization.vocab_size}
  special_tokens:
    - ${tokenization.training.pre_tokenization_split_token}
  pre_tokenization_regex: |-
    '(?:[sdmt]|ll|ve|re)| ?\p{L}+| ?\p{N}+| ?[^\s\p{L}\p{N}]+|\s+(?!\S)|\s+
training:
  corpus_path: ${train_corpus_path}
  num_processes: 32
  pre_tokenization_split_token: "<|endoftext|>"
tokenized_train_set_path: data/tokenized/train.dat
tokenized_val_set_path: data/tokenized/val.dat
